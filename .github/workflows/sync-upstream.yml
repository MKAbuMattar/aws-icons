# Monthly sync from the official AWS Architecture Icons package. If new or
# changed icons land upstream, this opens a PR with the regenerated assets plus
# a ready-made changeset — merging the PR rides the normal release train.
name: Sync upstream icons

on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm sync

      - name: Add changeset if assets changed
        id: diff
        run: |
          if [ -n "$(git status --porcelain assets/)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            cat > .changeset/upstream-sync-${{ github.run_id }}.md <<'EOF'
          ---
          '@aws-icons/svg': minor
          '@aws-icons/react': minor
          '@aws-icons/astro': minor
          ---

          Sync icon assets from the AWS Architecture Icons package
          EOF
          fi

      - name: Open PR
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: sync/upstream
          title: 'feat: sync upstream icons from AWS Architecture Icons'
          commit-message: 'feat: sync upstream icons from AWS Architecture Icons'
          body: |
            Automated monthly sync from the [official AWS Architecture Icons](https://aws.amazon.com/architecture/icons/).

            Review the `assets/` diff, then merge — the release pipeline takes it from there
            (canary on merge, `latest` via the Version Packages PR).
          delete-branch: true
